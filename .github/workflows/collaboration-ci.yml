name: Collaboration GUI validation

on:
  pull_request:
    branches: [develop]
  push:
    branches: [feature/friends-collaboration]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
